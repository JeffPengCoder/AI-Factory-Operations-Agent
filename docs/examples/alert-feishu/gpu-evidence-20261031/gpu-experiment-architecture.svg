<text x="65" y="668" font-size="22" font-weight="700" fill="#634b19">独立硬件对照：8张真实 L20 GPU 的 NVML ECC / remap 前后不变；生产 DCGM 始终 0 / 0 / 0。</text>
<text x="65" y="704" font-size="20" fill="#634b19">可用内核日志无对应 Xid，但日志窗口有限。本轮不能证明坏卡、物理损伤或 RMA 资格。</text>
