<title id="title">IRAOP与OpenSearch：入库及研究查询</title><desc id="desc">操作员一次提交PDF，由IRAOP解析切片，OpenSearch入库pipeline调用embedding服务后保存向量。查询时IRAOP调用OpenSearch及聊天模型返回答案和来源。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#546274" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="520" fill="#fff"/>
<style>text{font-family:Arial,'Noto Sans CJK SC','PingFang SC',sans-serif;fill:#192733}.title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:600}.sub{font-size:15px}.note{font-size:14px;fill:#46576a}.edge{stroke:#546274;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="30" y="38">IRAOP 是研究应用，OpenSearch 是知识库检索后端</text>
<text class="label" x="30" y="86">入库：一次提交，程序自动完成</text>
<rect x="30" y="110" width="190" height="84" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="125.0" y="141">操作员提交PDF</text>
<text text-anchor="middle" class="sub" x="125.0" y="165">持久 corpus + file API</text>
<rect x="260" y="110" width="205" height="84" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="362.5" y="141">IRAOP 入库服务</text>
<text text-anchor="middle" class="sub" x="362.5" y="165">提取文本、切成 chunks</text>
<rect x="505" y="110" width="240" height="84" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="625.0" y="141">OpenSearch pipeline</text>
<text text-anchor="middle" class="sub" x="625.0" y="165">请求向量并保存索引</text>
<rect x="805" y="110" width="245" height="84" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="927.5" y="141">OpenSearch 数据库</text>
<text text-anchor="middle" class="sub" x="927.5" y="165">文本 + 向量 + 页码</text>
<rect x="505" y="220" width="240" height="70" rx="10" fill="#eef3fa" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="625.0" y="251">Embedding 服务</text>
<text text-anchor="middle" class="sub" x="625.0" y="275">本现场：CPU / 384 维</text>
<path class="edge" d="M220 151 H260"/>
<path class="edge" d="M465 151 H505"/>
<path class="edge" d="M745 151 H805"/>
<path class="edge" d="M584 194 V220"/>
<path class="edge" d="M672 220 V194"/>
<text class="label" x="30" y="336">研究：检索资料，再生成有来源的答案</text>
<rect x="30" y="360" width="190" height="82" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="125.0" y="391">用户 / OpenClaw</text>
<text text-anchor="middle" class="sub" x="125.0" y="415">提出研究问题</text>
<rect x="260" y="360" width="205" height="82" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="362.5" y="391">IRAOP Research Agent</text>
<text text-anchor="middle" class="sub" x="362.5" y="415">组织查询与研究步骤</text>
<rect x="505" y="360" width="240" height="82" rx="10" fill="#f0f6e5" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="625.0" y="391">OpenSearch 检索</text>
<text text-anchor="middle" class="sub" x="625.0" y="415">关键词 + 向量混合查询</text>
<rect x="805" y="360" width="245" height="82" rx="10" fill="#eef3fa" stroke="#9bad84"/>
<text text-anchor="middle" class="label" x="927.5" y="391">聊天模型</text>
<text text-anchor="middle" class="sub" x="927.5" y="415">根据检索资料整理答案</text>
<path class="edge" d="M220 401 H260"/>
<path class="edge" d="M465 387 H505"/>
<path class="edge" d="M505 421 H465"/>
<path class="edge" d="M360 442 V458 H925 V442"/>
<path class="edge" d="M925 360 V350 H360 V360"/>
<text class="note" x="280" y="474">检索返回原文、文件名和页码；IRAOP汇总答案及来源，交回调用方。</text>
<text class="note" x="30" y="505">直接 upload API 也能自动入库；本次发现原PDF下载404，现阶段推荐持久 corpus + file API。</text></svg>
