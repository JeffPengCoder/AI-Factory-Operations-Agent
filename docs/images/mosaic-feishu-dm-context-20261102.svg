<text x="56" y="782" font-size="19" font-weight="normal" fill="#172b3b">通过原生通道回复同一用户</text>
<text x="56" y="809" font-size="19" font-weight="normal" fill="#172b3b">不能把自动交接回答当用户验收</text>
<rect x="485" y="690" width="380" height="135" rx="10" fill="#e7f1fa" stroke="#bdcbd3"/>
<text x="501" y="723" font-size="23" font-weight="bold" fill="#172b3b">用户普通私聊追问</text>
<text x="501" y="755" font-size="19" font-weight="normal" fill="#172b3b">不必复制报告、附 Run ID</text>
<text x="501" y="782" font-size="19" font-weight="normal" fill="#172b3b">不必点击引用回复</text>
<text x="501" y="809" font-size="19" font-weight="normal" fill="#172b3b">以真实平台入站及模型回复验收</text>
<rect x="930" y="690" width="380" height="135" rx="10" fill="#f7f1e5" stroke="#bdcbd3"/>
<text x="946" y="723" font-size="23" font-weight="bold" fill="#172b3b">Jeff&#x27;s AI Assistant</text>
<text x="946" y="755" font-size="19" font-weight="normal" fill="#172b3b">报告主动送达获准用户 DM</text>
<text x="946" y="782" font-size="19" font-weight="normal" fill="#172b3b">App ID / App Secret 原生通道</text>
<text x="946" y="809" font-size="19" font-weight="normal" fill="#172b3b">不是旧群 Webhook Bot</text>
