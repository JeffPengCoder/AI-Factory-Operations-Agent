<g font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" fill="#172b3b">
<text x="40" y="49" font-size="32" font-weight="bold" fill="#172b3b">MOSAIC：自动告警 → 完整报告 DM → 同一会话追问</text>
<text x="40" y="88" font-size="21" font-weight="normal" fill="#172b3b">新增关键步骤：真实 Agent 输入交接；展示镜像不能替代模型上下文。2026-11-02</text>
<rect x="40" y="120" width="380" height="135" rx="10" fill="#edf6df" stroke="#bdcbd3"/>
