<text x="501" y="533" font-size="23" font-weight="bold" fill="#172b3b">后台自动交接完整报告</text>
<text x="501" y="565" font-size="19" font-weight="normal" fill="#172b3b">正常 Gateway agent 输入</text>
<text x="501" y="592" font-size="19" font-weight="normal" fill="#172b3b">deliver=false / 禁用消息工具</text>
<text x="501" y="619" font-size="19" font-weight="normal" fill="#172b3b">交接响应不对外发送</text>
<rect x="930" y="500" width="380" height="135" rx="10" fill="#f7f1e5" stroke="#bdcbd3"/>
<text x="946" y="533" font-size="23" font-weight="bold" fill="#172b3b">完整核验 → 固定原生发送</text>
<text x="946" y="565" font-size="19" font-weight="normal" fill="#172b3b">真实 user 输入包含报告全文</text>
<text x="946" y="592" font-size="19" font-weight="normal" fill="#172b3b">显式 history 字符限额，拒绝截断</text>
<text x="946" y="619" font-size="19" font-weight="normal" fill="#172b3b">Gateway send 原报告；保存消息 ID</text>
<rect x="40" y="690" width="380" height="135" rx="10" fill="#e7f1fa" stroke="#bdcbd3"/>
