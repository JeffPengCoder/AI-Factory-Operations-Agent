<text x="56" y="185" font-size="19" font-weight="normal" fill="#172b3b">私有 DCGM：230=95 / 311=1 / 313=1</text>
<text x="56" y="212" font-size="19" font-weight="normal" fill="#172b3b">采样后关闭；回放 Pod 不申请 GPU</text>
<text x="56" y="239" font-size="19" font-weight="normal" fill="#172b3b">真实硬件计数保持</text>
<rect x="485" y="120" width="380" height="135" rx="10" fill="#edf6df" stroke="#bdcbd3"/>
<text x="501" y="153" font-size="23" font-weight="bold" fill="#172b3b">Prometheus → Alertmanager</text>
<text x="501" y="185" font-size="19" font-weight="normal" fill="#172b3b">真实指标、规则 for=45s</text>
<text x="501" y="212" font-size="19" font-weight="normal" fill="#172b3b">仅选择明确验收标签</text>
<text x="501" y="239" font-size="19" font-weight="normal" fill="#172b3b">run_id / fingerprint 关联</text>
<rect x="930" y="120" width="380" height="135" rx="10" fill="#edf6df" stroke="#bdcbd3"/>
<text x="946" y="153" font-size="23" font-weight="bold" fill="#172b3b">持久 worker + SQLite</text>
<text x="946" y="185" font-size="19" font-weight="normal" fill="#172b3b">独立后台轮询，无需网页</text>
<text x="946" y="212" font-size="19" font-weight="normal" fill="#172b3b">持久 Incident 去重</text>
<text x="946" y="239" font-size="19" font-weight="normal" fill="#172b3b">各阶段完整证据落盘</text>
