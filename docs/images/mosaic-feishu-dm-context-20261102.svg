<text x="946" y="343" font-size="23" font-weight="bold" fill="#172b3b">Jeff&#x27;s Mosaic Agent</text>
<text x="946" y="375" font-size="19" font-weight="normal" fill="#172b3b">View：实际调用日志与状态工具</text>
<text x="946" y="402" font-size="19" font-weight="normal" fill="#172b3b">独立 automation 调查会话</text>
<text x="946" y="429" font-size="19" font-weight="normal" fill="#172b3b">保留每次请求和完整结果</text>
<rect x="40" y="500" width="380" height="135" rx="10" fill="#f7f1e5" stroke="#bdcbd3"/>
<text x="56" y="533" font-size="23" font-weight="bold" fill="#172b3b">配置接收 Agent / DM 会话</text>
<text x="56" y="565" font-size="19" font-weight="normal" fill="#172b3b">delivery.target：获准 p2p chat</text>
<text x="56" y="592" font-size="19" font-weight="normal" fill="#172b3b">delivery.session_key：真实 Agent 会话</text>
<text x="56" y="619" font-size="19" font-weight="normal" fill="#172b3b">原生 Feishu binding 必须一致</text>
