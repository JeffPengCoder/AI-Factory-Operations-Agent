<rect width="1920" height="1190" fill="white"/>
<text class="title" x="70" y="72">GPU 告警 → Research → 原生飞书：持久后台流程</text>
<text class="sub" x="70" y="115">2026-11-02 更新｜故障侧为独立 DCGM 缓存模拟；调查与发布由程序编排，浏览器无需保持打开。</text>
<text class="small" x="70" y="151">绿色：告警与后台服务　　蓝色：只读采集和知识研究　　米色：投递、证据与历史路线</text>
<rect x="70" y="175" width="400" height="160" rx="13" fill="#edf5de" stroke="#c7d1d9" stroke-width="1.4"/>
<text class="heading" x="90" y="213">独立 DCGM 缓存</text>
<text class="body" x="90" y="251">GPU 0：230=95 / 311=1 / 313=1</text>
<text class="body" x="90" y="282">仅私有 socket；采样后关闭</text>
<text class="body" x="90" y="313">真实 GPU / 生产缓存不写入</text>
<rect x="530" y="175" width="400" height="160" rx="13" fill="#edf5de" stroke="#c7d1d9" stroke-width="1.4"/>
