<title id="title">GPU 告警、Research 与原生飞书：当前后台链路</title>
<desc id="desc">新建私有 DCGM 缓存和快照回放触发真实告警，持久服务自动进行只读取证、实际 IRAOP 咨询、完整报告生成和固定原生飞书投递；旧 Webhook 证据独立保留。</desc>
