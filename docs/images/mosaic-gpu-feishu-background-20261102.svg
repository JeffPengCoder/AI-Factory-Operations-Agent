<text class="body" x="550" y="251">回放 Pod 不申请 GPU</text>
<text class="body" x="550" y="282">ServiceMonitor 抓取测试指标</text>
<text class="body" x="550" y="313">真实规则求值，for=45s</text>
<rect x="990" y="175" width="400" height="160" rx="13" fill="#edf5de" stroke="#c7d1d9" stroke-width="1.4"/>
