<text class="body" x="1010" y="251">以 run_id / fingerprint 关联</text>
<text class="body" x="1010" y="282">新告警带专用验收标签</text>
<text class="body" x="1010" y="313">不修改原监控路由</text>
<rect x="1450" y="175" width="400" height="160" rx="13" fill="#edf5de" stroke="#c7d1d9" stroke-width="1.4"/>
<text class="heading" x="1470" y="213">后台服务 + SQLite</text>
<text class="body" x="1470" y="251">Spark 用户 systemd 持久运行</text>
<text class="body" x="1470" y="282">独立轮询；按事件持久去重</text>
<text class="body" x="1470" y="313">无须打开 MOSAIC 网页</text>
